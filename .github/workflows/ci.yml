name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
      - '*'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '2.5.1'
          - '2.4.4'
        puppet:
          - '~> 6.0'
          - '~> 5.0'
        exclude:
          - ruby: '2.5.1'
            puppet: '~> 5.0'
        include:
          - ruby: '2.5.1'
            puppet: '~> 6.0'
            check: 'syntax lint metadata_lint check:symlinks check:git_ignore check:dot_underscore check:test_file rubocop'
          - ruby: '2.5.1'
            puppet: '~> 6.0'
            check: 'parallel_spec'
          - ruby: '2.4.4'
            puppet: '~> 5.0'
            check: 'parallel_spec'
          - ruby: '2.5.1'
            puppet: '~> 5.0'
            check: 'build'
            deploy: 'yes'

    env:
      PUPPET_GEM_VERSION: ${{ matrix.puppet }}
      BEAKER_PUPPET_COLLECTION: ${{ matrix.puppet == '~> 6.0' && 'puppet6' || 'puppet5' }}
      CHECK: ${{ matrix.check }}
      DEPLOY_TO_FORGE: ${{ matrix.deploy || 'no' }}

    steps:
    - uses: actions/checkout@v2
    
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    
    - name: Bundle setup
      run: |
        bundle -v
        rm -f Gemfile.lock
        gem update --system
        gem --version
        bundle -v
        bundle install --jobs 4 --retry 3 --without system_tests
        
    - name: Run tests
      run: bundle exec rake $CHECK
      
  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0  # Nécessaire pour obtenir tous les tags
      
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '2.5.1'
          bundler-cache: true
          
      - name: Bundle setup
        run: |
          bundle -v
          rm -f Gemfile.lock
          gem update --system
          gem --version
          bundle -v
          bundle install --jobs 4 --retry 3 --without system_tests
          
      - name: Build module
        run: bundle exec rake build
      
      - name: Get version from tag
        id: get_version
        run: echo ::set-output name=VERSION::${GITHUB_REF#refs/tags/}
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.get_version.outputs.VERSION }}
          body: |
            Release ${{ steps.get_version.outputs.VERSION }}
            
            See [CHANGELOG](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md) for details.
          draft: false
          prerelease: false
          files: pkg/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Push to Puppet Forge
        env:
          PUPPET_FORGE_API_KEY: ${{ secrets.PUPPET_FORGE_API_KEY }}
        run: bundle exec rake module:push